server.address=${JARVIS_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=JARVIS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${JARVIS_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=16KB
spring.servlet.multipart.enabled=false
spring.datasource.url=${JARVIS_DB_URL:jdbc:postgresql://localhost:5432/jarvis}
spring.datasource.username=${JARVIS_DB_USER:jarvis_app}
spring.datasource.password=${JARVIS_DB_PASSWORD}
spring.flyway.user=${JARVIS_MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${JARVIS_MIGRATION_PASSWORD:${spring.datasource.password}}
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.log-resolved-exception=false
